[project]
name = "agent-runtime"
version = "0.1.0"
description = "Demo AI agent + execution loop (AI/Business Plane)"
requires-python = ">=3.11"
dependencies = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
