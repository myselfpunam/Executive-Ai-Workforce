[project]
name = "twenty-connector"
version = "0.1.0"
description = "Read-only Twenty CRM connector — business context and verified outcomes"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
