[project]
name = "control-sdk"
version = "0.1.0"
description = "Agent Control Adapter/SDK (Control Plane) — state machine, safe points, checkpoint, heartbeat, capabilities, idempotent command inbox"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
